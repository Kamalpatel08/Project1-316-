<!DOCTYPE html>
<html>
    <head>
        <title>Form Page</title>
    </head>
    <body>
        <form style="text-align: center;">
            <fieldset>
                <legend style="font-size: 30px; color: rgb(154, 154, 88);"><strong><u>Flower Form</u></strong></legend>
                <label for="fav">Name your favourite flower : </label>
                <input type="text" id="fav" name="fav" maxlength="20">
                <p>Do you like flowers?</p>
                <label for="like">YES</label>
                <input type="radio" name="like" id="like" value="Yes">
                <label for="like">NO</label>
                <input type="radio" name="like" id="like" value="No">
                <br><br>
                <label for="secret">Save your changes with a password:</label>
                <input type="password" name="secret" id="secret" required maxlength="20" minlength="8">
                <br><br>
                <label for="message">Feedback on Flowers</label><br>
                <textarea name="message" id="message" rows="15" cols="50"></textarea>
                <br><br>
                <fieldset>
                    <input type="submit" value="Submit">
                </fieldset>
            </fieldset>
        </form>
        <br><br><br>
        <p>Back to <a href="index.html">home page</a></p>
    </body>
    </body>
</html>
